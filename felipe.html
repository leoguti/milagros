<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat con Claude</title>
  <style>
    /* Diseño calmado: colores suaves, sin animaciones que distraigan, alto en claridad. */
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, 'Trebuchet MS', sans-serif;
      margin: 0;
      background: #eef2f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #223;
    }
    header {
      background: #4a6fa5;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .burbuja {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 19px;
      line-height: 1.5;
    }
    .claude {
      background: #ffffff;
      align-self: flex-start;
      border: 1px solid #d5dde6;
    }
    .claude::before {
      content: "Claude";
      display: block;
      font-size: 13px;
      color: #4a6fa5;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .yo {
      background: #d6e4f0;
      align-self: flex-end;
      color: #223;
    }
    .yo::before {
      content: "Tú";
      display: block;
      font-size: 13px;
      color: #2f5580;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .sistema {
      align-self: center;
      background: #e6ecf2;
      color: #556;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 10px;
    }
    footer {
      background: white;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #d5dde6;
    }
    #entrada {
      flex: 1;
      padding: 14px 18px;
      font-size: 19px;
      border: 2px solid #4a6fa5;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
    }
    #entrada:focus { border-color: #2f5580; }
    #enviar {
      padding: 14px 24px;
      font-size: 19px;
      background: #4a6fa5;
      color: white;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    #enviar:hover { background: #3d5d8c; }
    #enviar:disabled { background: #ccc; }
  </style>
</head>
<body>
  <header>Hola Felipe. Escribe cuando quieras.</header>

  <div id="chat">
    <div class="burbuja sistema">Conectando…</div>
  </div>

  <footer>
    <input id="entrada" placeholder="Escribe aquí y dale Enter" autofocus>
    <button id="enviar" onclick="enviar()">Enviar</button>
  </footer>

  <script>
    const TOPICO = 'felipe-claude-chat-2026agosto05';
    const URL_BASE = 'https://ntfy.envs.net/' + TOPICO;
    const chat = document.getElementById('chat');
    const entrada = document.getElementById('entrada');

    function agregar(clase, texto) {
      const div = document.createElement('div');
      div.className = 'burbuja ' + clase;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function enviar() {
      const texto = entrada.value.trim();
      if (!texto) return;
      entrada.value = '';
      agregar('yo', texto);
      try {
        await fetch(URL_BASE, {
          method: 'POST',
          headers: { 'Title': 'felipe' },
          body: texto
        });
      } catch (e) {
        agregar('sistema', 'No se pudo enviar: ' + e.message);
      }
    }

    entrada.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviar();
    });

    const vistos = new Set();
    function pintar(data, esHistorial) {
      if (!data || data.event !== 'message') return;
      if (data.id && vistos.has(data.id)) return;
      if (data.id) vistos.add(data.id);
      const remitente = data.title || '';
      if (remitente === 'claude') agregar('claude', data.message);
      else if (remitente === 'felipe' && esHistorial) agregar('yo', data.message);
    }
    async function cargarHistorial() {
      try {
        const res = await fetch(URL_BASE + '/json?poll=1&since=1h');
        const text = await res.text();
        text.trim().split(/\n/).forEach(line => { if (line) { try { pintar(JSON.parse(line), true); } catch (e) {} } });
      } catch (e) {}
    }
    cargarHistorial();
    const fuente = new EventSource(URL_BASE + '/sse');
    fuente.onopen = () => {};
    fuente.onmessage = (ev) => { try { pintar(JSON.parse(ev.data), false); } catch (e) {} };
    fuente.onerror = () => {};
  </script>
</body>
</html>
