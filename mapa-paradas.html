const TAM = 20;
const params = new URLSearchParams(location.search);
let tanda = Math.max(1, parseInt(params.get('tanda')||'1'));
const maxTanda = Math.ceil(P.length/TAM);
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM',maxZoom:19}).addTo(map);
const col = {ok:'#2ecc71', revisar:'#f39c12', rechazar:'#e74c3c'};
let capa = L.layerGroup().addTo(map);
function pintar(){
  capa.clearLayers();
  const sub = P.slice((tanda-1)*TAM, tanda*TAM);
  if(!sub.length) return;
  const b = [];
  sub.forEach(p=>{
    const m = L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:1.5,fillColor:col[p.estado],fillOpacity:.95});
    m.bindTooltip(p.n+'. '+p.nombre,{permanent:true,direction:'right',className:'lbl',offset:[7,0]});
    m.bindPopup('<b>'+p.n+'. '+p.nombre+'</b><br>por '+p.autor+'<br>'+p.lat.toFixed(4)+', '+p.lon.toFixed(4)+'<br>id='+p.id);
    capa.addLayer(m); b.push([p.lat,p.lon]);
  });
  map.fitBounds(b,{padding:[40,40]});
  document.getElementById('rng').textContent = '#'+sub[0].n+' – #'+sub[sub.length-1].n+'  (tanda '+tanda+'/'+maxTanda+')';
  document.getElementById('tit').textContent = 'Tanda '+tanda+': '+sub.length+' paradas';
}
document.getElementById('prev').onclick=()=>{ if(tanda>1){tanda--; pintar();} };
document.getElementById('next').onclick=()=>{ if(tanda<maxTanda){tanda++; pintar();} };
pintar();
